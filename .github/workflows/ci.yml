name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: both jobs only read the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check depfence/ tests/

      - name: Test
        run: pytest tests/ -v

  security-self-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Self-scan
        run: depfence scan . --format json --fail-on critical --no-fetch

  # Prove every pinned action SHA is a real commit (catches fabricated/typo pins
  # that a person or an LLM might write from memory). Resolves over the API —
  # it does not trust the text in the file. See scripts/verify-action-pins.sh.
  action-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Verify action pins resolve to real commits
        env:
          GH_TOKEN: ${{ github.token }}
        # Include the published composite action.yml, not just .github/workflows.
        run: bash scripts/verify-action-pins.sh .github/workflows action.yml
