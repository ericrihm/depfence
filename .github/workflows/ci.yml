name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: both jobs only read the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check depfence/ tests/

      - name: Test
        run: pytest tests/ -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install build==1.5.0 twine==7.0.0
      - name: Verify source version parity
        run: |
          python - <<'PY'
          import pathlib
          import tomllib

          expected = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          namespace = {}
          exec(pathlib.Path("depfence/__init__.py").read_text(), namespace)
          assert namespace["__version__"] == expected, (
              f"depfence.__version__={namespace['__version__']} != pyproject version={expected}"
          )
          PY
      - name: Verify documentation claims
        run: bash tools/docs-check.sh
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Install wheel and smoke-test entry points
        run: |
          python -m venv /tmp/depfence-smoke
          /tmp/depfence-smoke/bin/python -m pip install dist/*.whl
          /tmp/depfence-smoke/bin/depfence --version
          test -x /tmp/depfence-smoke/bin/depfence-mcp
          /tmp/depfence-smoke/bin/python -c "from depfence.mcp.server import main"
      - name: Retain distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  security-self-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Self-scan
        # Scan source only — tests/ contains intentional malicious payloads
        run: depfence scan depfence/ --format json --fail-on critical --no-fetch --allow-incomplete

  # Prove every pinned action SHA is a real commit (catches fabricated/typo pins
  # that a person or an LLM might write from memory). Resolves over the API —
  # it does not trust the text in the file. See scripts/verify-action-pins.sh.
  action-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Verify action pins resolve to real commits
        env:
          GH_TOKEN: ${{ github.token }}
        # Include the published composite action.yml, not just .github/workflows.
        run: bash scripts/verify-action-pins.sh .github/workflows action.yml
