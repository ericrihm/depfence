name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install build==1.5.0 twine==7.0.0
      - name: Verify release and source versions agree
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          expected = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          namespace = {}
          exec(pathlib.Path("depfence/__init__.py").read_text(), namespace)
          assert namespace["__version__"] == expected
          assert os.environ["RELEASE_TAG"].removeprefix("v") == expected, (
              f"release tag {os.environ['RELEASE_TAG']} does not match package {expected}"
          )
          PY
      - name: Build package
        run: python -m build
      - name: Validate distributions
        run: twine check dist/*
      - name: Install wheel and smoke-test CLI
        run: |
          python -m venv /tmp/depfence-smoke
          /tmp/depfence-smoke/bin/python -m pip install dist/*.whl
          /tmp/depfence-smoke/bin/depfence --version
          test -x /tmp/depfence-smoke/bin/depfence-mcp
          /tmp/depfence-smoke/bin/python -c "from depfence.mcp.server import main"
      - name: Upload validated distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write  # OIDC token for PyPI Trusted Publishing
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
