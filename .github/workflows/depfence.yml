name: Dependency Security Scan

on:
  push:
    branches: [main, master]
    paths:
      - "**/package-lock.json"
      - "**/yarn.lock"
      - "**/pnpm-lock.yaml"
      - "**/requirements*.txt"
      - "**/poetry.lock"
      - "**/Cargo.lock"
      - "**/go.sum"
  pull_request:
    paths:
      - "**/package-lock.json"
      - "**/yarn.lock"
      - "**/pnpm-lock.yaml"
      - "**/requirements*.txt"
      - "**/poetry.lock"
      - "**/Cargo.lock"
      - "**/go.sum"
  schedule:
    # Weekly scan every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Default to read-only; the scan job escalates to security-events: write below.
permissions:
  contents: read

jobs:
  depfence:
    name: depfence scan
    runs-on: ubuntu-latest

    permissions:
      # Required to upload SARIF to GitHub Code Scanning
      security-events: write
      # Required to check out private repos
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install depfence
        run: pip install depfence

      - name: Run dependency security scan
        run: depfence scan . --format sarif -o results.sarif
        # Continue so the SARIF upload step always runs, even on findings
        continue-on-error: true

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@ff0a06e83cb2de871e5a09832bc6a81e7276941f # v3
        if: always()
        with:
          sarif_file: results.sarif
          category: depfence
