name: Feature Request
description: Suggest a new scanner, output format, or capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or gap
      description: What attack class, ecosystem, or workflow isn't covered?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should depfence address this?
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - New scanner
        - New ecosystem
        - Output format
        - CLI improvement
        - CI/CD integration
        - Performance
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools or approaches you've looked at
