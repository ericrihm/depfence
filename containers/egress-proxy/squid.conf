http_port 3128
visible_hostname depfence-egress-proxy

# The allowlist is a read-only, operator-supplied file with one exact dstdomain
# per line. Use bare hostnames: GitHub.com, not .github.com.
acl allowed_git_hosts dstdomain "/etc/squid/allowed-domains.txt"
acl CONNECT method CONNECT
acl TLS_port port 443
acl prohibited_ipv4 dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4
acl prohibited_ipv6 dst ::/128 ::1/128 fc00::/7 fe80::/10 ff00::/8 2001:db8::/32

http_access deny prohibited_ipv4
http_access deny prohibited_ipv6
http_access deny !CONNECT
http_access deny !TLS_port
http_access allow allowed_git_hosts
http_access deny all

cache deny all
forwarded_for delete
request_header_access Via deny all
request_header_access X-Forwarded-For deny all
reply_header_access Server deny all
via off

access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
pid_filename /run/squid/squid.pid
coredump_dir /tmp
